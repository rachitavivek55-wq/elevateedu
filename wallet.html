<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Keep an eye on your balance and save up for the things on your wishlist." />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#4b3832" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ElevateEdu" />
    <title>Wallet — ElevateEdu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone">
      <!-- Title Bar with back button -->
      <header class="titlebar">
        <div class="brand">
          <a href="index.html" class="back-btn"
             aria-label="Back"><i data-lucide="arrow-left"></i
          ></a>
          <h1 class="brand-name">Wallet</h1>
        </div>
        <div class="date-chip">
          <span class="date-day" id="dateDay">—</span>
          <span class="date-month" id="dateMonth">—</span>
        </div>
      </header>

      <main class="screen">
        <!-- System intro card -->
        <section class="greeting-card">
          <p class="greeting-eyebrow">Wallet</p>
          <h2 class="greeting-title">Money, Managed</h2>
          <p class="greeting-sub">
            Track your balance and plan what you want next
          </p>
        </section>

        <!-- Tools -->
        <section class="systems">
          <h3 class="section-label">Tools</h3>
          <div class="grid">
            <article class="app-card" data-href="balance.html">
              <span class="app-icon"><i data-lucide="piggy-bank"></i></span>
              <div class="app-text">
                <span class="app-name">Balance</span>
                <span class="app-desc">Keep track of how much you have</span>
              </div>
              <i data-lucide="chevron-right" class="app-arrow"></i>
            </article>
            <article class="app-card" data-href="wishlist.html">
              <span class="app-icon"><i data-lucide="gift"></i></span>
              <div class="app-text">
                <span class="app-name">Wishlist</span>
                <span class="app-desc"
                  >Save items with their price &amp; links</span
                >
              </div>
              <i data-lucide="chevron-right" class="app-arrow"></i>
            </article>
          </div>
        </section>
      </main>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <button class="nav-item" data-tab="home">
          <span class="nav-icon"><i data-lucide="house"></i></span>
          <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-tab="planner">
          <span class="nav-icon"><i data-lucide="calendar-check"></i></span>
          <span class="nav-label">Planner</span>
        </button>
        <button class="nav-item active" data-tab="wallet">
          <span class="nav-icon"><i data-lucide="wallet"></i></span>
          <span class="nav-label">Wallet</span>
        </button>
        <button class="nav-item" data-tab="fitness">
          <span class="nav-icon"><i data-lucide="heart-pulse"></i></span>
          <span class="nav-label">Wellness</span>
        </button>
        <button class="nav-item" data-tab="mindset">
          <span class="nav-icon"><i data-lucide="brain"></i></span>
          <span class="nav-label">Mindset</span>
        </button>
        <button class="nav-item" data-tab="guides">
          <span class="nav-icon"><i data-lucide="book-open"></i></span>
          <span class="nav-label">Guides</span>
        </button>
      </nav>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
    <!-- w -->
  </body>
</html>
