<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Who is using it — ElevateEdu</title>
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --brown: #4b3832; --beige: #e7d8c9; --cream: #fff8f0; --muted: #8a7a70; --line: #f1e7dc; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        background: var(--cream);
        color: var(--brown);
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 620px; margin: 0 auto; padding: 26px 18px 70px; }
      h1 { font-size: 21px; font-weight: 600; margin: 0 0 4px; }
      .sub { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
      .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; margin-bottom: 26px; }
      .card { background: #fff; border: 1px solid var(--beige); border-radius: 16px; padding: 13px 15px; }
      .card b { display: block; font-size: 27px; font-weight: 600; line-height: 1.15; }
      .card span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
      h2 { font-size: 14.5px; font-weight: 600; margin: 0 0 9px; }
      .rows { background: #fff; border: 1px solid var(--beige); border-radius: 16px; overflow: hidden; }
      .row { display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-top: 1px solid var(--line); font-size: 13px; }
      .row:first-child { border-top: 0; }
      .row .d { flex: none; width: 104px; color: var(--muted); }
      .row .bar { height: 8px; border-radius: 99px; background: var(--brown); opacity: 0.85; }
      .row .n { margin-left: auto; font-weight: 600; }
      .msg { background: #fff; border: 1px solid var(--beige); border-radius: 16px; padding: 17px; font-size: 14px; line-height: 1.6; }
      .foot { margin-top: 18px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
      a { color: var(--brown); }
      .back { display: inline-block; margin-top: 22px; font-size: 13px; color: var(--muted); text-decoration: none; }
      @media (min-width: 640px) { .cards { grid-template-columns: repeat(4, 1fr); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="wrap">
      <h1>Who is using ElevateEdu</h1>
      <p class="sub" id="stSub">Loading…</p>
      <div id="stOut"></div>
      <a class="back" href="./index.html">← Back to the app</a>
    </div>
    <script>
      /* A tiny private dashboard. Everything it shows is a count — it never
         lists names or emails. The database decides whether to answer: if the
         signed-in account is not the owner it simply returns nothing. */
      (function () {
        var sub = document.getElementById('stSub');
        var out = document.getElementById('stOut');
        function msg(html) { sub.textContent = ''; out.innerHTML = '<div class="msg">' + html + '</div>'; }
        function n(v) { return typeof v === 'number' && isFinite(v) ? v : 0; }
        function pretty(day) {
          var p = String(day).split('-');
          var dt = new Date(+p[0], +p[1] - 1, +p[2]);
          if (isNaN(dt.getTime())) return String(day);
          return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }
        function card(v, label) { return '<div class="card"><b>' + v + '</b><span>' + label + '</span></div>'; }
        function render(d) {
          var days = Array.isArray(d.days) ? d.days.slice() : [];
          days.sort(function (a, b) { return String(b.day).localeCompare(String(a.day)); });
          var max = 1;
          days.forEach(function (r) { if (n(r.signups) > max) max = n(r.signups); });
          var html = '<div class="cards">';
          html += card(n(d.total), 'people have signed in');
          html += card(n(d.last7), 'came back this week');
          html += card(n(d.returning), 'used it on more than one day');
          html += card(n(d.saved), 'have saved real work');
          html += '</div>';
          html += '<h2>New sign-ins by day</h2>';
          if (!days.length) {
            html += '<div class="msg">Nobody has signed in yet.</div>';
          } else {
            html += '<div class="rows">';
            days.forEach(function (r) {
              var c = n(r.signups);
              var w = Math.max(8, Math.round((c / max) * 110));
              html += '<div class="row"><span class="d">' + pretty(r.day) + '</span>';
              html += '<span class="bar" style="width:' + w + 'px"></span>';
              html += '<span class="n">' + c + '</span></div>';
            });
            html += '</div>';
          }
          html += '<p class="foot">A sign-in means a Google account opened the app for the first time. ';
          html += '&ldquo;Saved real work&rdquo; means that account has at least one thing stored — classes, assignments, notes and so on. ';
          html += 'Only you can see this page.</p>';
          sub.textContent = 'Updated just now.';
          out.innerHTML = html;
        }
        async function go() {
          if (typeof supabase === 'undefined' || !supabase.createClient) {
            msg('Could not load the database library. Check your connection and refresh.');
            return;
          }
          var c = supabase.createClient(
            'https://vkpmasigkotdmfkmjqoy.supabase.co',
            'sb_publishable_Il0sbz8SOahZGLORSiYlLg_bbb5jOIi'
          );
          var got = null;
          try { got = await c.auth.getSession(); } catch (e) {}
          var session = got && got.data && got.data.session;
          if (!session) {
            msg('You are signed out. <a href="./index.html">Open the app</a>, sign in, then come back to this page.');
            return;
          }
          var res = null;
          try { res = await c.rpc('ee_admin_stats'); } catch (e) { res = { error: e }; }
          if (res && res.error) {
            msg(
              '<b>Not set up yet.</b><br />The counting function is missing from the database, ' +
              'so there is nothing to read. Run the one-time setup query in the Supabase SQL editor, ' +
              'then refresh this page.'
            );
            return;
          }
          if (!res || !res.data) {
            msg('This page is private — it only works on the owner account.');
            return;
          }
          render(res.data);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', go);
        } else {
          go();
        }
      })();
    </script>
  </body>
</html>
